<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}flexTri{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
{% block head %}{% endblock %}
<style>
:root {
  --bg: #f7f7f5; --card: #ffffff; --ink: #1d1d1b; --quiet: #6b6b66; --line: #e3e2dd;
  --accent: #2f6fdb; --accent-tint: #e6eefb;
  --done: #2e9e4f; --partial: #e0a020; --missed: #d24b4b; --rest: #ecebe7;
  --swim: #2f8fd8; --bike: #e07b26; --run: #8a5cd6; --strength: #6b6b66; --brick: #c2477f;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --card: #1f1f1d; --ink: #f0efea; --quiet: #a3a29c; --line: #34332f;
          --accent: #6b9cf0; --accent-tint: #1e2a3f; --rest: #2a2a27; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
header a { color: var(--ink); text-decoration: none; }
.brand { font-weight: 700; font-size: 18px; }
.brand span { color: var(--accent); }
.quit { margin: 0 0 0 12px; }
.quit button { padding: 4px 10px; color: var(--quiet); }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 4px 0 16px; }
h2 { font-size: 17px; margin: 0 0 12px; }
a { color: var(--accent); }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
label { display: block; margin: 10px 0 4px; font-weight: 600; }
.hint { color: var(--quiet); font-size: 13px; font-weight: 400; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { margin: 0; font-weight: 400; }
.chips input { position: absolute; opacity: 0; }
.chips span { display: inline-block; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.chips input:checked + span { background: var(--accent-tint); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.chips input:focus-visible + span { outline: 2px solid var(--accent); }
.banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; background: var(--accent-tint); display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.banner.error { background: color-mix(in srgb, var(--missed) 15%, var(--card)); }
.banner ul { margin: 0; padding-left: 18px; }
.gsend { margin: 0; display: grid; gap: 8px; justify-items: start; }
.gsend .gsend-busy, .gsend.htmx-request .gsend-idle { display: none; }
.gsend.htmx-request .gsend-busy { display: inline; }
.gsend-out:empty { display: none; }
.gsend-note { border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, currentColor 8%, transparent); max-width: 52ch; text-align: left; }
.gsend-note.error { background: #fde8e6; color: #8a1f14; }
.gsend-note a { color: inherit; font-weight: 600; }
.gsend-note details { margin-top: 4px; }
.gsend-note ul { margin: 4px 0 0; padding-left: 18px; }
.sport-swim { --sport: var(--swim); } .sport-bike { --sport: var(--bike); } .sport-run { --sport: var(--run); }
.sport-strength { --sport: var(--strength); } .sport-brick { --sport: var(--brick); } .sport-rest { --sport: var(--quiet); }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">flex<span>Tri</span></a>
  <div style="display:flex;align-items:center">{% block nav %}{% endblock %}
  {% if request.app.state.desktop %}<form method="post" action="/app/quit" class="quit"><button title="Stop flexTri">Quit</button></form>{% endif %}</div>
</header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
